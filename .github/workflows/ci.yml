name: Cinemate CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Verification & Tests
  backend-tests:
    name: Backend Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cinemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run backend automated tests (Jest + Supertest)
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5000
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || '6cd3fd8c162aca4c4446d7f3d546f8cf' }}
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cinemate
          REDIS_URL: redis://localhost:6379
        run: npm test

  # 2. Frontend Build Verification
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Cinemate-main/cinema-main/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./Cinemate-main/cinema-main
        run: npm ci

      - name: Build frontend application
        working-directory: ./Cinemate-main/cinema-main
        env:
          REACT_APP_API_BASE_URL: http://localhost:5000/api
        run: npm run build

  # 3. Docker Container Build Verification
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t cinemate-backend:latest ./server

      - name: Build Frontend Docker Image
        run: docker build -t cinemate-frontend:latest ./Cinemate-main/cinema-main
